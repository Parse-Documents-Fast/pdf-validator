services:
  pdf-validator:
    build: .
    environment:
      - HTTP_ADDR=:8000
      - ENV=production
    networks:
      - fast_pdf_network
    restart: unless-stopped
    # Servicio interno (ADR-0004): sin ruta publica ni labels de Traefik.
    # pdf-main lo consume por DNS interno: http://pdf-validator:8000
    deploy:
      replicas: 5
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

networks:
  fast_pdf_network:
    external: true
