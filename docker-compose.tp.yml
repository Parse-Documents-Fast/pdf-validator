services:
  pdf-validator:
    build: .
    environment:
      - HTTP_ADDR=:8000
      - MAX_FILE_SIZE_MB=10
      - ENV=production
    networks:
      - fast_pdf_network
    restart: unless-stopped
    deploy:
      replicas: 5
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

networks:
  fast_pdf_network:
    external: true
