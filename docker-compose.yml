services:
  pdf-validator:
    build: .
    environment:
      - HTTP_ADDR=:8000
      - MAX_FILE_SIZE_MB=10
    networks:
      - fast_pdf_network
    restart: unless-stopped
    # No port bindings to host to enforce internal-only traffic
    # No traefik labels since it's an internal microservice

networks:
  fast_pdf_network:
    external: true
